name: Build Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # npm 11 (Node 24) blocks install scripts by default; Electron needs its
      # postinstall to download the runtime binary.
      - run: node node_modules/electron/install.js
      - run: npm run desktop:build
      - uses: softprops/action-gh-release@v2
        with:
          files: release/Still-Setup.exe
          generate_release_notes: true